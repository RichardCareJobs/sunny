<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunny card actions – reference (card_actions_v1)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="card-actions.css">
<style>
  body { margin: 0; padding: 32px 20px; background: #F4F1ED; font-family: Roboto, system-ui, sans-serif; color: #1F1F1F; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 28px; color: #5F6368; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 390px)); gap: 32px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #5F6368; margin: 0 0 10px; }
  /* Simplified card shell – only the action section (.sca) is what changes */
  .card { background: #fff; border: 2px solid #F28A3A; border-radius: 28px; padding: 18px 22px 24px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 4px; font-size: 22px; }
  .card .meta { color: #5F6368; font-size: 15px; margin: 0 0 14px; }
  .card .placeholder { height: 110px; border-radius: 16px; background: #E9E4DE; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; color: #8A847D; font-size: 13px; }
  .card hr { border: 0; border-top: 1px solid #EFEFEF; margin: 0 -22px 16px; }
  #log { margin-top: 28px; font: 12px/1.5 ui-monospace, monospace; background: #fff; border-radius: 12px; padding: 12px; white-space: pre-wrap; max-height: 220px; overflow: auto; }
</style>
</head>
<body>
<h1>Venue card actions — experiment card_actions_v1</h1>
<p class="lead">Visual source of truth for both variants. Tap anything to see the analytics payload below (links are disabled here).</p>
<div class="grid" id="grid"></div>
<div id="log">Event log…</div>

<script src="card-actions.js"></script>
<script>
  var combos = [
    { variant: 'rows',   isNear: true,  label: 'rows (B2) · close by' },
    { variant: 'rows',   isNear: false, label: 'rows (B2) · further away' },
    { variant: 'button', isNear: true,  label: 'button (D2) · close by' },
    { variant: 'button', isNear: false, label: 'button (D2) · further away' }
  ];
  var grid = document.getElementById('grid');
  var log = document.getElementById('log');
  function track(type, meta) {
    log.textContent = type + ' ' + JSON.stringify(meta) + '\n' + (log.textContent === 'Event log…' ? '' : log.textContent);
  }
  combos.forEach(function (c) {
    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<p class="label">' + c.label + '</p>' +
      '<div class="card"><h2>The Maryville Tavern</h2>' +
      '<p class="meta">' + (c.isNear ? '~9 min walk' : '~40 min walk') + ' · Pub/Bar</p>' +
      '<div class="placeholder">venue photo + weather chips (unchanged)</div><hr>' +
      SunnyCardActions.render({
        variant: c.variant, isNear: c.isNear, walkMins: 9, distanceKm: 3.1,
        directionsUrl: '#directions', uberUrl: '#uber', linkAttrs: ''
      }) + '</div>';
    grid.appendChild(wrap);
    SunnyCardActions.bind(wrap, track, { venue_id: 'ChIJ94nVQP8Uc2sRAK5dti7BRmU', venue_name: 'The Maryville Tavern', provider: 'google', distance_m: c.isNear ? 577 : 3100 });
    wrap.addEventListener('click', function (e) { if (e.target.closest('a')) e.preventDefault(); });
  });
</script>
</body>
</html>
